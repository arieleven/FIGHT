name: Build FIGHT IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Testing on simulator $UDID"
          STATUS=0
          xcodebuild test \
            -project FIGHT.xcodeproj \
            -scheme FIGHTTests \
            -destination "id=$UDID" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || STATUS=$?
          grep -E "Test Case .*(passed|failed)|error:|Executed [0-9]+ test|TEST (SUCCEEDED|FAILED)" test.log || tail -50 test.log
          exit $STATUS

      - name: Build Unsigned Release App
        run: |
          set -o pipefail
          xcodebuild \
            -project FIGHT.xcodeproj \
            -scheme FIGHT \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Fails the run if the built app is missing keys that cause an instant
      # launch crash (Bluetooth privacy string / background mode) or the
      # Sideloadly "extensionDictionary must be set" install error.
      - name: Verify Info.plist keys in built products
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/FIGHT.app
          WIDGET="$APP/PlugIns/FIGHTWidget.appex"
          echo "--- App Info.plist ---";    plutil -p "$APP/Info.plist"
          echo "--- Widget Info.plist ---"; plutil -p "$WIDGET/Info.plist"
          plutil -extract NSBluetoothAlwaysUsageDescription raw "$APP/Info.plist"
          plutil -extract UIBackgroundModes xml1 -o - "$APP/Info.plist" | grep -q bluetooth-central
          plutil -extract NSSupportsLiveActivities raw "$APP/Info.plist"
          plutil -extract NSHealthUpdateUsageDescription raw "$APP/Info.plist"
          plutil -extract NSHealthShareUsageDescription raw "$APP/Info.plist"
          plutil -extract NSMotionUsageDescription raw "$APP/Info.plist"
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Info.plist"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$WIDGET/Info.plist" | grep -q com.apple.widgetkit-extension
          echo "All required Info.plist keys present."

      # Ad-hoc signature (no certificate) whose only job is to carry the
      # HealthKit entitlement inside the binary. Sideloadly reads entitlements
      # from the existing signature when it re-signs with your Apple ID.
      - name: Package IPA with embedded entitlements
        run: |
          set -e
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FIGHT.app Payload/
          APP=Payload/FIGHT.app
          codesign --force --sign - --timestamp=none "$APP/PlugIns/FIGHTWidget.appex"
          codesign --force --sign - --timestamp=none --entitlements Config/FIGHT.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q com.apple.developer.healthkit
          echo "HealthKit entitlement embedded."
          zip -qry FIGHT.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIGHT-IPA
          path: FIGHT.ipa
