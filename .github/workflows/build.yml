name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned Release App
        run: |
          set -o pipefail
          xcodebuild \
            -project CoospoTracker.xcodeproj \
            -scheme CoospoTracker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Fails the run if the built app is missing keys that cause an instant
      # launch crash (Bluetooth privacy string / background mode) or the
      # Sideloadly "extensionDictionary must be set" install error.
      - name: Verify Info.plist keys in built products
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/CoospoTracker.app
          WIDGET="$APP/PlugIns/CoospoWidgetExtension.appex"
          echo "--- App Info.plist ---";    plutil -p "$APP/Info.plist"
          echo "--- Widget Info.plist ---"; plutil -p "$WIDGET/Info.plist"
          plutil -extract NSBluetoothAlwaysUsageDescription raw "$APP/Info.plist"
          plutil -extract UIBackgroundModes xml1 -o - "$APP/Info.plist" | grep -q bluetooth-central
          plutil -extract NSSupportsLiveActivities raw "$APP/Info.plist"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$WIDGET/Info.plist" | grep -q com.apple.widgetkit-extension
          echo "All required Info.plist keys present."

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CoospoTracker.app Payload/
          zip -qry CoospoTracker.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoospoTracker-IPA
          path: CoospoTracker.ipa
