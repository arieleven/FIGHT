name: CoospoTracker
options:
  bundleIdPrefix: com.shon
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"

# IMPORTANT: there is intentionally NO `info:` block on either target.
# XcodeGen's `info:` block REGENERATES (overwrites) the plist at that path,
# which wiped the Bluetooth usage strings, background modes and NSExtension
# from the committed plists. Pointing INFOPLIST_FILE at the files and leaving
# `info:` out makes the committed Info.plist files the single source of truth.

targets:
  CoospoTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shon.coospotracker
        PRODUCT_NAME: CoospoTracker
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: CoospoWidgetExtension
        embed: true

  CoospoWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shon.coospotracker.widget
        PRODUCT_NAME: CoospoWidgetExtension
        INFOPLIST_FILE: Sources/Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
