<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="FIGHT — data-driven conditioning for fighters">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#161a24"/>
    </linearGradient>
    <linearGradient id="zones" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.25" stop-color="#22c55e"/>
      <stop offset="0.5" stop-color="#eab308"/>
      <stop offset="0.75" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#ef4444" stop-opacity="1"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="1"/>
    </linearGradient>
  
    
    <linearGradient id="lg-glove" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ff6a52"/>
      <stop offset="0.5" stop-color="#e5162c"/>
      <stop offset="1" stop-color="#a00a1d"/>
    </linearGradient>
    <linearGradient id="lg-thumb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7d66"/>
      <stop offset="1" stop-color="#e01a2f"/>
    </linearGradient>
    <linearGradient id="lg-cuff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d0716"/>
      <stop offset="1" stop-color="#b30d22"/>
    </linearGradient>
    <filter id="lg-glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280"/>
    <path d="M160 0V400M320 0V400M480 0V400M640 0V400M800 0V400M960 0V400M1120 0V400"/>
  </g>

  <!-- heart-rate trace: rounds and rests -->
  <path d="M0 322 L120 322 L150 321 L170 284 L185 337 L200 319 L260 317
           L300 316 L330 274 L345 332 L360 313 L420 309 L450 307 L480 260 L495 322 L510 298
           L560 298 L600 318 L640 321
           L680 320 L710 279 L725 331 L740 308 L800 304 L830 302 L860 250 L875 318 L890 289
           L940 287 L980 315 L1020 319 L1060 318 L1090 245 L1105 313 L1120 279 L1180 274 L1280 274"
        fill="none" stroke="url(#fade)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>

  <!-- zone band -->
  <rect x="80" y="352" width="1120" height="8" rx="4" fill="url(#zones)" opacity="0.9"/>
  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9ca3af" font-weight="600">
    <text x="80" y="382">Z1 RECOVERY</text>
    <text x="330" y="382">Z2 AEROBIC</text>
    <text x="570" y="382">Z3 TEMPO</text>
    <text x="800" y="382">Z4 THRESHOLD</text>
    <text x="1060" y="382">Z5 ANAEROBIC</text>
  </g>

  <!-- title block -->
  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g transform="translate(76 52) scale(0.17)">
      <rect width="1024" height="1024" rx="228" fill="#1a0c0f" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>
      

  <g transform="translate(28 34) rotate(-28 540 500)" filter="url(#lg-shadow)">
    <!-- cuff / wrist -->
    <rect x="196" y="410" width="250" height="236" rx="46" fill="url(#lg-cuff)"/>
    <!-- fist -->
    <path d="M410 330
             C470 240 650 222 770 262
             C880 300 902 420 880 505
             C858 595 772 650 655 650
             L470 650
             C410 650 372 610 372 548
             L372 420
             C372 385 388 355 410 330 Z"
          fill="url(#lg-glove)"/>
    <!-- thumb wrapping the front -->
    <path d="M478 400
             C540 312 716 296 808 350
             C852 376 848 438 798 444
             C722 452 616 440 548 462
             C500 478 452 440 478 400 Z"
          fill="url(#lg-thumb)" stroke="#9a0a1b" stroke-width="10" stroke-linejoin="round"/>
    <!-- highlight -->
    <path d="M520 300 C600 262 700 260 760 284 C690 282 600 296 540 330 Z" fill="#ffffff" opacity="0.35"/>
    <!-- knuckle seam -->
    <path d="M560 560 C650 585 760 570 840 520" fill="none" stroke="#8a0819" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- heartbeat line: the glove's cuff stripe becomes the pulse -->
  <path d="M120 735 L360 735 L404 668 L460 830 L520 610 L566 760 L598 735 L904 735"
        fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#lg-glow)"/>

    </g>
    <text x="268" y="150" font-size="96" font-weight="900" fill="#ffffff" letter-spacing="6">FIGHT</text>
    <text x="270" y="196" font-size="24" font-weight="600" fill="#d1d5db">Data-driven conditioning for kickboxers, Muay Thai &amp; MMA fighters</text>
    <text x="82" y="248" font-size="18" font-weight="500" fill="#9ca3af">Live HR rounds • Coach ratings &amp; next-session plans • HRV readiness • Fight-camp periodization • Safe weight cuts</text>
  </g>
</svg>
