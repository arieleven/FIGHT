<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="FIGHT. Train like it's fight week.">
  <rect width="1280" height="420" fill="#0B0B0C"/>

  <!-- Three 3-minute rounds with 1-minute rests: heart rate climbs, drops on the stool, creeps higher by round 3 -->
  <g transform="translate(770 92)">
    <rect x="0" y="0" width="130" height="236" fill="#161618"/>
    <rect x="170" y="0" width="130" height="236" fill="#161618"/>
    <rect x="340" y="0" width="130" height="236" fill="#161618"/>
    <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B6B70" letter-spacing="1.5">
      <text x="12" y="224">R1</text>
      <text x="182" y="224">R2</text>
      <text x="352" y="224">R3</text>
    </g>
    <line x1="0" y1="70" x2="470" y2="70" stroke="#2E2E33" stroke-width="2" stroke-dasharray="6 8"/>
    <polyline fill="none" stroke="#E8262E" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"
      points="0,190 26,120 52,98 86,88 130,82 150,128 170,150 196,96 230,76 264,70 300,66 320,112 340,132 366,80 400,60 434,52 466,46"/>
    <circle cx="466" cy="46" r="8" fill="#E8262E"/>
  </g>

  <!-- Same font stack as the original banner: SF Pro on Apple devices, Segoe UI on Windows -->
  <text x="88" y="196" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="128" font-weight="900" fill="#FFFFFF" letter-spacing="6">FIGHT</text>
  <rect x="92" y="222" width="96" height="8" fill="#E8262E"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="92" y="282" font-size="30" font-weight="700" fill="#FFFFFF">Train like it's fight week.</text>
    <text x="92" y="320" font-size="19" font-weight="400" fill="#9A9AA0">Rounds, roadwork, recovery and the weight cut.</text>
    <text x="92" y="346" font-size="19" font-weight="400" fill="#9A9AA0">One iPhone app, built for fighters.</text>
  </g>
</svg>
